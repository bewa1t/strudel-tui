[package]
name = "strudel"
version = "0.1.0"
edition = "2024"
description = "Terminal live-coding REPL for Strudel with vim keys, offline samples and MIDI"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bewa1t/strudel-tui"
readme = "README.md"
keywords = ["strudel", "livecoding", "music", "tui", "tidalcycles"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
chromiumoxide = "0.9.1"
edtui = { version = "0.11.7", features = ["syntax-highlighting"] }
futures = "0.3"
percent-encoding = "2"
ratatui = "0.30"
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
ureq = "2"
url = "2"
